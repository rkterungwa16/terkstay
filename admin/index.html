<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Config Dashboard — Adire Hotels</title>
  <link rel="stylesheet" href="/admin/dashboard.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <div class="layout">
    <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">Config Dashboard</div>
        <a class="view-site" id="viewSiteLink" href="/" target="_blank" rel="noopener" aria-label="View site (opens in new tab)">View site ↗</a>
      </div>
      <nav id="nav" class="nav" aria-label="Config sections"></nav>
    </aside>

    <div class="main" id="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
          <span class="menu-toggle-bar"></span>
        </button>
        <div id="status" class="status" role="status" aria-live="polite">Loading…</div>
        <div class="topbar-actions">
          <button id="discardBtn" class="btn btn-outline" disabled>Discard changes</button>
          <button id="saveBtn" class="btn btn-primary" disabled>Save changes</button>
        </div>
      </header>
      <main id="content" class="content" tabindex="-1"></main>
      <aside class="activity-panel">
        <div class="activity-head">Recent changes</div>
        <div id="activityLog" class="activity-log"></div>
      </aside>
    </div>
  </div>

  <script type="module" src="/admin/dashboard.js"></script>
</body>
</html>
